services:
  # ============================================================================
  # Express REST API & BullMQ Execution Worker (Combined for Render Free Tier)
  # ============================================================================
  - type: web
    name: aica-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm approve-builds --all && pnpm build
    startCommand: node apps/worker/dist/index.js & node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JUDGE0_API_URL
        value: http://localhost:2358
