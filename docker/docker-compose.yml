version: '3.8'

services:
  # ============================================================================
  # Core Application Databases & Message Broker
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: aica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aica_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: aica-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: aica-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Judge0 CE v1.13.1 Isolated Code Execution Sandbox
  # ============================================================================
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: aica-judge0-server
    restart: unless-stopped
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=judge0
      - JUDGE0_ENABLE_WAIT_RESULT=true
      - JUDGE0_ENABLE_COMPILER_OPTIONS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: aica-judge0-workers
    restart: unless-stopped
    command: ["./scripts/workers"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=judge0
    privileged: true
    depends_on:
      judge0-server:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
  redis_data:
